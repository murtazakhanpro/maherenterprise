<!DOCTYPE html>
<html>
<head>
    <title>Image Test</title>
</head>
<body>
    <img src="reference folder/Shara-e-Faisal_skyline_Karachi_g…_202605140135.jpeg" id="img1" width="100">
    <img src="reference folder/Shara-e-Faisal_skyline_Karachi_g…_202605140135 (1).jpeg" id="img2" width="100">
    <img src="reference folder/Shara-e-Faisal_skyline_Karachi_g…_202605140135 (2).jpeg" id="img3" width="100">
    <script>
        window.onload = () => {
            const results = {
                img1: document.getElementById('img1').naturalWidth > 0,
                img2: document.getElementById('img2').naturalWidth > 0,
                img3: document.getElementById('img3').naturalWidth > 0
            };
            const div = document.createElement('div');
            div.id = 'results';
            div.innerText = JSON.stringify(results);
            document.body.appendChild(div);
        };
    </script>
</body>
</html>
